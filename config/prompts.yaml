# Settings of the prompt pipeline stages (PromptPipelineConfig):
# FilterPrompts, SplitDev and VerifyPrompts.

# Policy tokenizer; a prompt's length is measured after its chat template.
tokenizer: Qwen/Qwen3-1.7B

# Qwen3 template switch: no thinking block in the generation prompt.
chat_template_kwargs:
  enable_thinking: false

# Prompts longer than this after the template are dropped.
max_prompt_tokens: 512

# Rows of the train source held out as the dev split.
dev_size: 2000

# Seed of the key hash that picks the dev rows.
hash_seed: 0

# Smallest row counts verify_prompts accepts per split.
min_rows:
  train: 40000
  dev: 2000
  test: 1000
