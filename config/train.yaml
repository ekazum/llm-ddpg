# Training job settings (TrainConfig), read by scripts/train_job.sh. Paths are
# relative to the repo root; `data` is a symlink to the lab share.

# Policy (the actor) and reward model, as Hugging Face ids; both are read from the cache.
policy_model: Qwen/Qwen3-1.7B
reward_model: Skywork/Skywork-Reward-V2-Qwen3-1.7B

# Devices the two models are loaded on. Two GPUs: reward_device cuda:1.
policy_device: cuda:0
reward_device: cuda:0

# Qwen3 template switch: no thinking block; the same as in config/prompts.yaml.
chat_template_kwargs:
  enable_thinking: false

# Longest response, in tokens; also the width of the replay buffer's response column.
max_new_tokens: 512

# Sampling temperature of the actor; above 0.
temperature: 1.0

# Prompts per actor batch, and the most prompts the actor GPU worker generates for at once.
actor_batch_size: 32
generate_batch_size: 32

# Seconds the actor GPU worker waits for more prompts before it generates for what it has.
generate_idle_timeout_s: 0.2

# Longest (prompt, response) input the reward model reads, in tokens.
reward_max_tokens: 2048

# Reward model batching: pairs per sort window, idle seconds before a flush,
# characters per batch.
reward_window_size: 256
reward_idle_timeout_s: 0.2
reward_batch_chars: 64000

# Replay buffer rows (1 to any), priority exponent (0 = uniform, up to 1),
# first importance weight exponent (0 to 1), draws over which it rises to 1,
# and the floor added to each TD error (above 0).
replay_capacity: 100000
per_alpha: 0.6
per_beta_start: 0.4
per_n_anneal: 100000
per_priority_floor: 0.01

# Devices the critic trains on, one copy each (one or more); with two, each
# takes half of every batch and the copies average their gradients.
# Two GPUs: [cuda:0, cuda:1], submitted with --gpus 2.
learner_devices: [cuda:0]

# Rows per learner batch (1 or more, a multiple of the learner device count),
# and rows stored before the first draw (at least the batch size is used).
learner_batch_size: 32
min_buffer_size: 512

# Batches drawn per hold of the buffer lock, drawn batches queued ahead, and
# pinned slots in the pool (each 1 or more; slots at least the device count,
# each holding one device's share of a batch).
block_batches: 4
prefetch_depth: 8
pinned_slots: 8

# Learner updates between two buffer stats and learner_diag rows (1 or more);
# with two or more learner devices, also between two checks that the copies match.
stats_every_updates: 16

# Critic learning rate, falling linearly to the minimum over max_updates (above 0; minimum 0 or more).
critic_lr: 5.0e-6
critic_lr_min: 5.0e-7

# Step of the target critic toward the critic after each update (above 0, up to 1).
critic_tau: 0.05

# Rows per critic forward and backward pass (1 or more); bounds the activation memory.
critic_micro_batch: 32

# Actor learning rate, falling linearly to the minimum over max_updates (above 0;
# minimum 0 or more). Starting guesses, not tuned.
actor_lr: 1.0e-6
actor_lr_min: 1.0e-7

# Critic updates before the first actor step (0 or more; max_updates or more
# keeps the actor frozen), and critic updates per actor step after it (1 or more).
actor_start_update: 128
actor_every: 1

# Rows per actor forward and backward pass (1 or more); bounds the
# rows x tokens x vocabulary probabilities in memory. A guess, not measured.
actor_micro_batch: 4

# Critic updates before the job stops (1 or more); at most
# max_actor_transitions / push_per_update_ratio when the ratio is on.
max_updates: 512

# Updates between two snapshots of the critic and the actor (0 = none), and
# whether every snapshot is kept (false: only the best dev one and the latest;
# about 3.4 GB for each model in bfloat16).
checkpoint_every: 128
keep_snapshots: false

# Device of the eval policy (a bfloat16 copy of the actor), which scores each
# actor snapshot on dev and the best one on test. Two GPUs: cuda:1.
eval_device: cuda:0

# Prompts generated per eval batch (1 or more), and the sampling temperature
# of the eval passes (0 = greedy, as in the baseline job).
eval_batch_size: 32
eval_temperature: 0.0

# Dev prompts scored per snapshot, a sample drawn once per run from the seed
# (0 = every row), and test prompts scored (0 = every row).
dev_limit: 256
test_limit: 0

# Most transitions the actor writes.
max_actor_transitions: 2048

# Transitions stored per learner update, held by both the actor and the
# learner; 0 turns the limit off.
push_per_update_ratio: 4

# Seed of the prompt order and of the replay draws.
seed: 0

# Directory of the three prompts files, and the directory run records go under.
prompts_dir: data/pipeline/prompts
records_dir: data/records
